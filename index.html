<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>文化祭 QRスキャナー</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    body{
      margin:0;
      background:#0f1115;
      color:white;
      font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Yu Gothic",sans-serif
    }
    .wrap{max-width:640px;margin:0 auto;padding:16px}
    #reader{overflow:hidden;border-radius:18px;background:#222}
    #status{margin-top:14px;padding:14px;border-radius:14px;background:#1f2937;text-align:center}
    .ok{background:#14532d!important}
    .error{background:#7f1d1d!important}
  </style>
</head>
<body>
<div class="wrap">
  <h1>文化祭 QRスキャナー</h1>
  <div id="reader"></div>
  <div id="status">カメラを起動しています…</div>

  <!-- CORSを使わずPOSTするための非表示iframe -->
  <iframe name="cfPostTarget" style="display:none"></iframe>
</div>

<script>
const params = new URLSearchParams(location.search);
const callback = params.get('callback') || '';
const sid = params.get('sid') || '';
const statusEl = document.getElementById('status');

let scanner = null;
let done = false;

async function startScanner() {
  if (!callback || !sid) {
    statusEl.className='error';
    statusEl.textContent='受付画面からQRカメラを開き直してください。';
    return;
  }

  try {
    scanner = new Html5Qrcode('reader', {
      formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE],
      verbose:false
    });

    await scanner.start(
      {facingMode:'environment'},
      {
        fps:10,
        qrbox:(w,h)=>{
          const edge=Math.floor(Math.min(w,h)*0.72);
          return {width:edge,height:edge};
        },
        aspectRatio:1
      },
      onScanSuccess,
      ()=>{}
    );

    statusEl.textContent='QRコードを枠内に入れてください。';
  } catch(err) {
    statusEl.className='error';
    statusEl.textContent='カメラを起動できません。ブラウザのカメラ許可を確認してください。';
  }
}

async function onScanSuccess(decodedText) {
  if (done) return;
  done = true;

  const ticketId = String(decodedText || '').trim().toUpperCase();

  statusEl.className='ok';
  statusEl.textContent='読み取り成功。受付へ送信しています…';

  try {
    if (scanner) await scanner.stop();
  } catch (_) {}

  try {
    const form = document.createElement('form');
    form.method = 'POST';
    form.action = callback;
    form.target = 'cfPostTarget';
    form.style.display = 'none';

    const fields = {
      scan_callback:'1',
      sid:sid,
      ticket:ticketId
    };

    Object.entries(fields).forEach(([name,value]) => {
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = name;
      input.value = value;
      form.appendChild(input);
    });

    document.body.appendChild(form);
    form.submit();

    statusEl.className='ok';
    statusEl.textContent='送信しました。受付画面で結果を確認してください。';

    setTimeout(() => {
      try { window.close(); } catch (_) {}
    }, 1500);

  } catch (err) {
    statusEl.className='error';
    statusEl.textContent='受付への送信に失敗しました。もう一度お試しください。';
    done = false;
  }
}

startScanner();
</script>
</body>
</html>
