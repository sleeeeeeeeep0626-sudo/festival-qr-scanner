<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>文化祭 QRスキャナー</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    body{
      margin:0;
      background:#0f1115;
      color:white;
      font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Yu Gothic",sans-serif
    }
    .wrap{max-width:640px;margin:0 auto;padding:16px}
    #reader{overflow:hidden;border-radius:18px;background:#222}
    #status{margin-top:14px;padding:14px;border-radius:14px;background:#1f2937;text-align:center}
    .ok{background:#14532d!important}
    .error{background:#7f1d1d!important}
  </style>
</head>
<body>
<div class="wrap">
  <h1>文化祭 QRスキャナー</h1>
  <div id="reader"></div>
  <div id="status">カメラを起動しています…</div>
</div>

<script>
const params = new URLSearchParams(location.search);
const callback = params.get('callback') || '';
const sid = params.get('sid') || '';
const statusEl = document.getElementById('status');

let scanner = null;
let done = false;

async function startScanner() {
  try {
    scanner = new Html5Qrcode('reader', {
      formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE],
      verbose:false
    });

    await scanner.start(
      {facingMode:'environment'},
      {
        fps:10,
        qrbox:(w,h)=>{
          const edge=Math.floor(Math.min(w,h)*0.72);
          return {width:edge,height:edge};
        },
        aspectRatio:1
      },
      onScanSuccess,
      ()=>{}
    );

    statusEl.textContent='QRコードを枠内に入れてください。';
  } catch(err) {
    statusEl.className='error';
    statusEl.textContent='カメラを起動できません。ブラウザのカメラ許可を確認してください。';
  }
}

async function onScanSuccess(decodedText) {
  if (done) return;
  done = true;

  const ticketId = String(decodedText || '').trim().toUpperCase();

  statusEl.className='ok';
  statusEl.textContent='読み取り成功。受付処理中です。';

  try {
    if (scanner) await scanner.stop();
  } catch (_) {}

  if (!callback || !sid) {
    statusEl.className='error';
    statusEl.textContent='受付画面との接続情報がありません。';
    return;
  }

  try {
    // Apps Script のURLへ画面遷移すると、モバイル環境で
    // Google Drive に誤転送されることがあるため、裏でPOSTする。
    const body =
      'sid=' + encodeURIComponent(sid) +
      '&ticket=' + encodeURIComponent(ticketId);

    await fetch(callback, {
      method:'POST',
      mode:'no-cors',
      headers:{
        'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'
      },
      body:body,
      redirect:'follow',
      cache:'no-store'
    });

    statusEl.className='ok';
    statusEl.textContent='受付に送信しました。元の受付画面をご確認ください。';

    setTimeout(() => {
      try { window.close(); } catch (_) {}
    }, 900);

  } catch (err) {
    statusEl.className='error';
    statusEl.textContent='受付への送信に失敗しました。もう一度お試しください。';
    done = false;
  }
}

startScanner();
</script>
</body>
</html>
