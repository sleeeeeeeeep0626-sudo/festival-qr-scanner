<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>文化祭 QRスキャナー</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    body{
      margin:0;
      background:#0f1115;
      color:white;
      font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Yu Gothic",sans-serif
    }
    .wrap{max-width:640px;margin:0 auto;padding:16px}
    #reader{overflow:hidden;border-radius:18px;background:#222}
    #status{margin-top:14px;padding:14px;border-radius:14px;background:#1f2937;text-align:center}
    .ok{background:#14532d!important}
    .error{background:#7f1d1d!important}
  </style>
</head>
<body>
<div class="wrap">
  <h1>文化祭 QRスキャナー</h1>
  <div id="reader"></div>
  <div id="status">カメラを起動しています…</div>

</div>

<script>
const params = new URLSearchParams(location.search);
const callback = params.get('callback') || '';
const sid = params.get('sid') || '';
const statusEl = document.getElementById('status');

let scanner = null;
let done = false;

async function startScanner() {
  if (!callback || !sid) {
    statusEl.className='error';
    statusEl.textContent='受付画面からQRカメラを開き直してください。';
    return;
  }

  try {
    scanner = new Html5Qrcode('reader', {
      formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE],
      verbose:false
    });

    await scanner.start(
      {facingMode:'environment'},
      {
        fps:10,
        qrbox:(w,h)=>{
          const edge=Math.floor(Math.min(w,h)*0.72);
          return {width:edge,height:edge};
        },
        aspectRatio:1
      },
      onScanSuccess,
      ()=>{}
    );

    statusEl.textContent='QRコードを枠内に入れてください。';
  } catch(err) {
    statusEl.className='error';
    statusEl.textContent='カメラを起動できません。ブラウザのカメラ許可を確認してください。';
  }
}

async function onScanSuccess(decodedText) {
  if (done) return;
  done = true;

  const ticketId = String(decodedText || '').trim().toUpperCase();

  statusEl.className='ok';
  statusEl.textContent='読み取り成功。受付へ送信しています…';

  try {
    if (scanner) await scanner.stop();
  } catch (_) {}

  try {
    // GoogleへPOSTしない。正常に開けることが確認済みの
    // 受付Web /exec へ戻し、読取情報は URL fragment(#) に載せる。
    // fragment はGoogleサーバーには送信されず、受付画面のJSだけが読む。
    const hash =
      '#cfscan=1' +
      '&sid=' + encodeURIComponent(sid) +
      '&ticket=' + encodeURIComponent(ticketId);

    statusEl.className='ok';
    statusEl.textContent='読み取り成功。受付画面へ戻ります。';

    location.replace(callback + hash);

  } catch (err) {
    statusEl.className='error';
    statusEl.textContent='受付画面へ戻れませんでした。もう一度お試しください。';
    done = false;
  }
}

startScanner();
</script>
</body>
</html>
